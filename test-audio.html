<!DOCTYPE html>
<html>
<head>
    <title>Test Audio URLs</title>
</head>
<body>
    <h1>Test de URLs de Audio</h1>
    <div id="results"></div>

    <script>
        const urls = [
            'https://cdn.pixabay.com/audio/2024/10/23/audio_3c79e62850.mp3',
            'https://cdn.pixabay.com/audio/2025/01/04/audio_7b8f2e4c91.mp3',
            'https://cdn.pixabay.com/audio/2025/01/20/audio_5d6a3f8b47.mp3',
            'https://cdn.pixabay.com/audio/2021/02/01/audio_9a4e7c2d85.mp3',
            'https://cdn.pixabay.com/audio/2025/01/02/audio_8f5b9d1a63.mp3'
        ];

        const results = document.getElementById('results');
        
        urls.forEach((url, index) => {
            const audio = new Audio();
            const div = document.createElement('div');
            div.innerHTML = `<p>Probando ${index + 1}: ${url}</p>`;
            results.appendChild(div);
            
            audio.addEventListener('canplay', () => {
                div.innerHTML += `<span style="color: green;">✅ OK</span>`;
            });
            
            audio.addEventListener('error', (e) => {
                div.innerHTML += `<span style="color: red;">❌ Error: ${e.type}</span>`;
            });
            
            audio.src = url;
        });
    </script>
</body>
</html>
